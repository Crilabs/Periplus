name: ci

# Pull requests run on pull_request; push only for main (a PR branch would otherwise run twice).
on:
  # Docs-only changes (specs, plans, README) run nothing; prompts under config/ are .md too and still count.
  pull_request:
    paths-ignore: ["docs/**", "*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md"]

# Least privilege by default; only the deploy job may push images.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Three independent jobs instead of one long chain: static checks, the unit tests in shards, build plus e2e.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy script tests
        run: npm run test:ops
      - run: npm run lint
      - run: npm run typecheck
      # lib/db/schema and drizzle/ stay in sync: a schema change without its migration makes generate write one.
      - name: Schema and migrations in sync
        run: |
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "lib/db/schema differs from drizzle/: run npm run db:generate and commit the migration" >&2
            git status --porcelain drizzle >&2
            exit 1
          fi

  # Each shard has its own test Postgres, so the shards also do not wait on each other's rows.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start test services
        run: bash .github/scripts/start-test-services.sh
      # Playwright's browser download, keyed on the lock file (it pins the Playwright version).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      # The converter tests render pages in Chromium, the PDF tests run pdftotext.
      - name: Chromium and pdftotext
        run: bash .github/scripts/install-browsers.sh --pdftotext
      - run: npx vitest run --shard=${{ matrix.shard }}/3
      - name: Service logs on failure
        if: failure()
        run: docker compose -f docker/compose.dev.yml logs --no-color --tail 200

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start test services
        run: bash .github/scripts/start-test-services.sh
      # Playwright's browser download, keyed on the lock file (it pins the Playwright version).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - name: Chromium
        run: bash .github/scripts/install-browsers.sh
      # Next's incremental build cache; a hit only speeds the build up, a stale one is ignored by Next.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      # Against the build above (no second build), served standalone like the web image.
      - run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: "1"
      - name: Service logs on failure
        if: failure()
        run: docker compose -f docker/compose.dev.yml logs --no-color --tail 200

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static, test, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/crilabs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          tags: ghcr.io/crilabs/periplus-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build and push worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/worker.Dockerfile
          push: true
          tags: ghcr.io/crilabs/periplus-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - name: Build and push postgres
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/postgres
          file: docker/postgres/Dockerfile
          push: true
          tags: ghcr.io/crilabs/periplus-postgres:${{ github.sha }}
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      # The server pulls with its own persistent read-only ghcr.io login (docs/runbook.md), never with this job's token.
      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SHA: ${{ github.sha }}
        run: ssh -i ~/.ssh/id_deploy "periplus@$HOST" bash -s "$SHA" < scripts/deploy/deploy.sh
